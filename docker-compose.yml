# Base PostgreSQL locale pour le développement : `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retrouve
    ports:
      - "5432:5432"
    volumes:
      - retrouve-db:/var/lib/postgresql/data
volumes:
  retrouve-db:
